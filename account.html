<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản cá nhân - BookShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div id="header"></div>

    <main class="container py-5">
        <div class="row g-4">
            <!-- Sidebar điều hướng tài khoản -->
            <div class="col-md-4 col-lg-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-person-circle display-4 text-primary"></i>
                        <h5 class="mt-2 mb-0 fw-bold" id="sidebarUserName">Tên người dùng</h5>
                        <small class="text-muted" id="sidebarUserEmail">email@example.com</small>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="account.html" class="list-group-item list-group-item-action active">
                            <i class="bi bi-person me-2"></i>Thông tin cá nhân
                        </a>
                        <a href="orders.html" class="list-group-item list-group-item-action">
                            <i class="bi bi-bag-check me-2"></i>Đơn hàng của tôi
                        </a>
                        <a href="wishlist.html" class="list-group-item list-group-item-action">
                            <i class="bi bi-heart me-2"></i>Sách yêu thích
                        </a>
                        <button type="button" id="btnLogoutSidebar" class="list-group-item list-group-item-action text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </div>
                </div>
            </div>

            <!-- Nội dung chính -->
            <div class="col-md-8 col-lg-9">
                <!-- Cập nhật thông tin -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Hồ sơ của tôi</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="profileForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Email (Không thể thay đổi)</label>
                                    <input type="email" class="form-control bg-light" id="accEmail" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label for="accName" class="form-label">Họ và tên</label>
                                    <input type="text" class="form-control" id="accName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="accPhone" class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-control" id="accPhone" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="accAddress" class="form-label">Địa chỉ giao hàng mặc định</label>
                                    <input type="text" class="form-control" id="accAddress" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-4">Lưu thay đổi</button>
                        </form>
                    </div>
                </div>

                <!-- Đổi mật khẩu -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">Đổi mật khẩu</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="changePasswordForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="oldPassword" class="form-label">Mật khẩu hiện tại</label>
                                    <input type="password" class="form-control" id="oldPassword" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                                    <input type="password" class="form-control" id="newPassword" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="confirmNewPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                    <input type="password" class="form-control" id="confirmNewPassword" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-outline-primary mt-4">Cập nhật mật khẩu</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
