<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị người dùng - BookShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar Admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="admin-dashboard.html">BookShop Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Thống kê</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-books.html">Quản lý Sách</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-orders.html">Quản lý Đơn hàng</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-reviews.html">Quản lý Đánh giá</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin-users.html">Quản lý Người dùng</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <a href="index.html" class="btn btn-outline-light btn-sm me-2">Xem trang chủ</a>
                    <button id="btnAdminLogout" class="btn btn-danger btn-sm">Đăng xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h3 class="fw-bold mb-0">Quản lý người dùng</h3>
            <div class="d-flex gap-2">
                <input type="text" id="searchUser" class="form-control" placeholder="Tìm theo tên hoặc email...">
                <select id="filterRole" class="form-select w-auto">
                    <option value="all">Tất cả vai trò</option>
                    <option value="user">Khách hàng (User)</option>
                    <option value="admin">Quản trị viên (Admin)</option>
                </select>
                <select id="filterStatus" class="form-select w-auto">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Hoạt động</option>
                    <option value="locked">Bị khóa</option>
                </select>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="adminUsersTable">
                            <!-- Render bằng admin-users.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
