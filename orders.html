<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - BookShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div id="header"></div>

    <main class="container py-5">
        <div class="row g-4">
            <!-- Sidebar điều hướng -->
            <div class="col-md-4 col-lg-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-person-circle display-4 text-primary"></i>
                        <h5 class="mt-2 mb-0 fw-bold" id="sidebarUserName">Tên người dùng</h5>
                        <small class="text-muted" id="sidebarUserEmail">email@example.com</small>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="account.html" class="list-group-item list-group-item-action">
                            <i class="bi bi-person me-2"></i>Thông tin cá nhân
                        </a>
                        <a href="orders.html" class="list-group-item list-group-item-action active">
                            <i class="bi bi-bag-check me-2"></i>Đơn hàng của tôi
                        </a>
                        <a href="wishlist.html" class="list-group-item list-group-item-action">
                            <i class="bi bi-heart me-2"></i>Sách yêu thích
                        </a>
                        <button type="button" id="btnLogoutSidebar" class="list-group-item list-group-item-action text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </div>
                </div>
            </div>

            <!-- Danh sách đơn hàng -->
            <div class="col-md-8 col-lg-9">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">Lịch sử đơn hàng</h5>
                        <select id="filterOrderStatus" class="form-select form-select-sm w-auto">
                            <option value="all">Tất cả trạng thái</option>
                            <option value="pending">Chờ xác nhận</option>
                            <option value="shipping">Đang giao</option>
                            <option value="done">Đã giao</option>
                            <option value="cancelled">Đã hủy</option>
                        </select>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã đơn</th>
                                        <th>Ngày đặt</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái</th>
                                        <th class="text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="myOrdersList">
                                    <!-- Dữ liệu render bằng my-orders.js -->
                                </tbody>
                            </table>
                        </div>
                        <div id="emptyOrdersMessage" class="text-center py-5 d-none">
                            <i class="bi bi-box-seam display-4 text-muted"></i>
                            <p class="mt-2 text-muted">Bạn chưa có đơn hàng nào.</p>
                            <a href="products.html" class="btn btn-primary btn-sm">Mua sắm ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Chi tiết đơn hàng -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Chi tiết đơn hàng <span id="modalOrderId" class="text-primary"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalOrderBody">
                    <!-- Nội dung chi tiết đơn hàng -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/my-orders.js"></script>
</body>
</html>
